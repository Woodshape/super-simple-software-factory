# Privileged SSSF self-maintenance roster.
# Existing ADWs resolve the fixed role name `builder`, so the maintenance builder
# deliberately keeps that name. Use this roster only for reviewed SSSF machinery
# changes, never for normal product implementation.
defaults:
  coding_agent: pi
  model: openai-codex/gpt-5.6-luna
  thinking: max
  harness_engineering: []
  tools:
    - read
    - bash
    - edit
    - write
    - grep
    - find
    - ls
  protected_files:
    - adws/adw_modules/
    - adws/adw_sssf_config/
    - adws/adw_*.py
  data_dir: adws/adw_data

observability:
  db: adws/adw_data/sssf.db
  poll_ms: 500

agents:
  - name: builder
    model: openai-codex/gpt-5.6-sol
    thinking: high
    color: "#f59e0b"
    purpose: Maintain SSSF machinery within an explicit self-modification allowlist and report every changed file.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/builder/system.md
      user: adws/adw_data/prompt_engineering/builder/user.md
    writes:
      - adws/adw_modules/
      - adws/adw_build_review.py
      - adws/adw_data/prompt_engineering/builder/user.md
      - adws/tests/
      - .agents/skills/sssf/templates/
      - .agents/skills/sssf/references/
      - .agents/skills/sssf/tests/
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - edit
      - write

  - name: reviewer
    model: openai-codex/gpt-5.6-terra
    thinking: high
    color: "#fb7185"
    purpose: Confirm that an SSSF maintenance change matches its specification without modifying the repository.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/reviewer/system.md
      user: adws/adw_data/prompt_engineering/reviewer/user.md
    writes: []
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write
